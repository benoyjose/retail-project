apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: retail-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      containers:
        - name: cart-service
          image: retail/cart-service:latest
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: retail-global-config
            - secretRef:
                name: retail-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: retail-system
spec:
  selector:
    app: cart-service
  ports:
    - port: 8084
      targetPort: 8084
---
