server:
  port: 0

spring:
  application:
    name: wishlist-service-test
  datasource:
    url: jdbc:h2:mem:wishlist_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false

