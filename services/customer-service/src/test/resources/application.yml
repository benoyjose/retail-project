server:
  port: 0

spring:
  application:
    name: customer-service-test
  datasource:
    url: jdbc:h2:mem:customer_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false

encryption:
  secret-key: RetailMicroservicesSystemKey2026!

app:
  kafka:
    topics:
      customer-registered: test-customer-registered-topic

