server:
  port: 0

spring:
  application:
    name: product-service-test
  datasource:
    url: jdbc:h2:mem:product_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  cloud:
    config:
      enabled: false
    openfeign:
      circuitbreaker:
        enabled: false

eureka:
  client:
    enabled: false

