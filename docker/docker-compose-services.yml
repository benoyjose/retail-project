version: '3.8'

services:
  config-server:
    build:
      context: ..
      dockerfile: infrastructure/config-server/Dockerfile
    container_name: retail-config-server
    restart: always
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=native
    networks:
      - retail-network

  eureka-server:
    build:
      context: ..
      dockerfile: infrastructure/eureka-server/Dockerfile
    container_name: retail-eureka-server
    restart: always
    ports:
      - "8761:8761"
    networks:
      - retail-network

  api-gateway:
    build:
      context: ..
      dockerfile: infrastructure/api-gateway/Dockerfile
    container_name: retail-api-gateway
    restart: always
    depends_on:
      - eureka-server
    ports:
      - "8080:8080"
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
    networks:
      - retail-network

  customer-service:
    build:
      context: ..
      dockerfile: services/customer-service/Dockerfile
    container_name: retail-customer-service
    restart: always
    depends_on:
      - eureka-server
    ports:
      - "8082:8082"
    environment:
      - MYSQL_HOST=mysql
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
    networks:
      - retail-network

  product-service:
    build:
      context: ..
      dockerfile: services/product-service/Dockerfile
    container_name: retail-product-service
    restart: always
    depends_on:
      - eureka-server
    ports:
      - "8083:8083"
    environment:
      - MYSQL_HOST=mysql
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
    networks:
      - retail-network

  cart-service:
